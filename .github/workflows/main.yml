name: Build binaries

on:
  workflow_dispatch:
  push:
    branches:
      - "**"
    paths-ignore:
      - '**.md'
      - '.devcontainer/**'
      - '.github/ISSUE_TEMPLATE/**'
      - '.github/FUNDING.yml'
      - '.github/**/*.md'
      - '.vscode/**'
      - 'HBC/**'
      - 'Languages/**'
  pull_request:
    paths-ignore:
      - '**.md'
      - '.devcontainer/**'
      - '.github/ISSUE_TEMPLATE/**'
      - '.github/FUNDING.yml'
      - '.github/**/*.md'
      - '.vscode/**'
      - 'HBC/**'
      - 'Languages/**'

jobs:
  build:
    runs-on: ubuntu-latest
    container: devkitpro/devkitppc:20250527
    steps:
      - uses: actions/checkout@v4

      - name: Configure Git
        run: git config --system --add safe.directory "$GITHUB_WORKSPACE"

      - name: Compile USB Loader GX
        run: make release -j2

      # Locate the real outputs once for every step below. The linker writes
      # the map next to the objects (build/), not next to the ELF; probe
      # both, fail on neither-found. Unscoped: a missing output fails any
      # build loudly instead of an upload silently missing it.
      - name: Check diagnostic files present
        run: |
          set -e
          test -f boot.dol || { echo "missing boot.dol"; exit 1; }
          test -f boot.elf || { echo "missing boot.elf"; exit 1; }
          if test -f build/boot.elf.map; then
            echo "MAPFILE=build/boot.elf.map" >> "$GITHUB_ENV"
          elif test -f boot.elf.map; then
            echo "MAPFILE=boot.elf.map" >> "$GITHUB_ENV"
          else
            echo "missing boot.elf.map (neither build/ nor root)"; exit 1
          fi

      - name: Package
        if: ${{ vars.ALLOW_UPLOADS == 'true' }}
        run: |
          mkdir -p upload/apps/usbloader_gx
          cp boot.dol upload/apps/usbloader_gx
          cp HBC/icon.png upload/apps/usbloader_gx
          cp HBC/meta.xml upload/apps/usbloader_gx
          echo "sha=$(git rev-parse --short=7 HEAD)" >> $GITHUB_ENV

      - name: Upload binary
        if: ${{ vars.ALLOW_UPLOADS == 'true' }}
        uses: actions/upload-artifact@v4
        with: 
          name: usbloadergx_${{ env.sha }}
          path: upload

      - name: Upload debug binary
        if: ${{ vars.ALLOW_UPLOADS == 'true' }}
        uses: actions/upload-artifact@v4
        with: 
          name: usbloadergx_${{ env.sha }}_debug
          path: |
            boot.elf
            ${{ env.MAPFILE }}

      # Diagnostic bundle, scoped to the relocation-evidence branch only.
      # Each check is its own step so a failure names itself in the step
      # list (logs need owner access). Any missing file or unresolved
      # symbol fails the run before the upload.
      - name: Check stack symbols present in ELF
        if: ${{ github.ref == 'refs/heads/diag/reloc-evidence' }}
        run: |
          set -e
          NM="${DEVKITPPC:-/opt/devkitpro/devkitPPC}/bin/powerpc-eabi-nm"
          "$NM" boot.elf | grep -E ' (__stack_addr|__stack_end)$' | tee diag-symbols.txt
          test -s diag-symbols.txt || { echo "stack symbols absent from ELF"; exit 1; }

      - name: Check stack symbols resolved
        if: ${{ github.ref == 'refs/heads/diag/reloc-evidence' }}
        run: |
          set -e
          test -s diag-symbols.txt || { echo "no symbols file to check"; exit 1; }
          NM="${DEVKITPPC:-/opt/devkitpro/devkitPPC}/bin/powerpc-eabi-nm"
          "$NM" boot.elf | grep -E ' (__stack_addr|__stack_end)$' \
            | awk '$2 ~ /^[Uuvw]$/ {bad=1} END{exit bad}' \
            || { echo "UNRESOLVED weak stack symbol (links fine, dangles)"; exit 1; }

      - name: Write diagnostic manifest
        if: ${{ github.ref == 'refs/heads/diag/reloc-evidence' }}
        run: |
          set -e
          {
            echo "commit $(git rev-parse HEAD)"
            sha256sum boot.dol boot.elf "$MAPFILE"
          } | tee diag-MANIFEST.txt

      - name: Upload diagnostic bundle
        if: ${{ github.ref == 'refs/heads/diag/reloc-evidence' }}
        uses: actions/upload-artifact@v4
        with:
          name: diag-bundle-${{ github.sha }}
          path: |
            boot.dol
            boot.elf
            ${{ env.MAPFILE }}
            diag-MANIFEST.txt
            diag-symbols.txt
